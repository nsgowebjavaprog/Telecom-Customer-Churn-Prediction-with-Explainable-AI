<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Telecom Churn Prediction</title>
<link rel="stylesheet" href="style.css" />
<!-- React + ReactDOM + Babel via CDN: lets us write JSX directly in the
     browser with zero npm/build step, so this runs by just opening the
     file or serving it statically. For a "real" production frontend you'd
     use `npx create-vite my-app --template react` and a proper build, but
     this keeps the project runnable anywhere in seconds. -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script src="app.js" type="text/babel"></script>
</body>
</html>
